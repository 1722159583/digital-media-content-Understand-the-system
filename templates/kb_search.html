<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识库检索 - 智能数字媒体内容理解系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
    <div id="auth-loading">
        <div class="loading-spinner"></div>
        <p>加载中...</p>
    </div>

    <div id="main-app" style="display: none;">
        <header>
            <div class="header-left">
                <h1>🎬 智能数字媒体内容理解系统</h1>
                <span>基于 YOLO + Agent 的智能分析平台</span>
            </div>
            <div class="header-right">
                <div id="user-info" class="user-info">
                    <span class="username">用户</span>
                    <span class="role">普通用户</span>
                    <button id="logout-btn" class="btn-logout">退出登录</button>
                </div>
            </div>
        </header>

        <nav class="main-nav">
            <a href="/" class="nav-item">📊 任务管理</a>
            <a href="/kb/manage" class="nav-item">📚 知识库管理</a>
            <a href="/kb/search" class="nav-item active">🔍 知识库检索</a>
            <a href="/agent/analysis" class="nav-item">🤖 Agent分析</a>
            <a href="/visualization" class="nav-item">📈 数据可视化</a>
        </nav>

        <main>
            <section class="search-section">
                <h2>🔍 知识库检索</h2>
                <form id="search-form">
                    <div class="search-group">
                        <input type="text" id="search-query" placeholder="输入检索关键词，如：游戏角色、审核规范、素材分类..." required />
                        <button type="submit" id="search-btn">检索</button>
                    </div>
                    <div class="search-options">
                        <div class="form-group">
                            <label>选择知识库</label>
                            <select id="search-kb-id">
                                <option value="">全部知识库</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>返回数量</label>
                            <select id="search-top-k">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>相似度阈值</label>
                            <input type="range" id="search-threshold" min="0" max="1" step="0.1" value="0.5" />
                            <span id="threshold-value">0.5</span>
                        </div>
                    </div>
                </form>
            </section>

            <section class="search-results-section">
                <div class="section-header">
                    <h2>📄 检索结果</h2>
                    <span id="results-count">共 0 条结果</span>
                </div>
                <div id="search-results" class="search-results">
                    <p class="loading-text">请输入关键词进行检索</p>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
