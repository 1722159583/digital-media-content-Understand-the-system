<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - 智能数字媒体内容理解系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🎬 智能数字媒体内容理解系统</h1>
                <p>创建您的账号</p>
            </div>
            <form id="register-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required />
                    <small>用户名长度3-20字符，支持中英文、数字和下划线</small>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required />
                    <small>密码长度至少6位，建议包含字母和数字</small>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirm-password" placeholder="请再次输入密码" required />
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱地址" required />
                    <small>用于找回密码和接收通知</small>
                </div>
                <button type="submit" id="register-btn" class="btn-primary">注册</button>
                <div class="auth-links">
                    <span>已有账号？</span>
                    <a href="/login">立即登录</a>
                </div>
            </form>
            <div id="register-error" class="error-message" style="display: none;"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
