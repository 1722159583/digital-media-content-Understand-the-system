<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据看板 - 游戏高光自动剪辑</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body class="main-page">
    <div class="main-bg-video">
        <video autoplay muted loop playsinline>
            <source src="/source/y2mate.com - Star Guardian 2022  Official Orchestral Theme  League of Legends_1080p_1.mp4" type="video/mp4" />
        </video>
        <div class="main-bg-overlay"></div>
    </div>

    <div id="auth-loading">
        <div class="loading-spinner"></div>
        <p>加载中...</p>
    </div>

    <div id="main-app" style="display: none;">
        <header>
            <div class="header-left">
                <div class="header-logo">
                    <img src="/source/c47a07e29f04c6b4c1fdd4722953cc9d.jpg" alt="Logo" class="main-logo" />
                    <div class="header-title">
                        <h1>游戏高光自动剪辑</h1>
                        <span>AI 智能剪辑助手</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div id="user-info" class="user-info">
                    <span class="username">用户</span>
                    <button id="logout-btn" class="btn-logout">退出</button>
                </div>
            </div>
        </header>

        <nav class="main-nav">
            <a href="/home" class="nav-item">🎮 剪辑任务</a>
            <a href="/visualization" class="nav-item active">📊 数据看板</a>
            <a href="/stats" class="nav-item">📈 数据统计</a>
            <div class="nav-dropdown">
                <button class="nav-dropdown-toggle">⚙️ 高级工具</button>
                <div class="nav-dropdown-menu">
                    <a href="/kb/manage" class="nav-dropdown-item">📦 素材库管理</a>
                    <a href="/kb/search" class="nav-dropdown-item">🔍 素材搜索</a>
                    <a href="/agent/analysis" class="nav-dropdown-item">🤖 智能分析</a>
                    <a href="/model/compare" class="nav-dropdown-item">⚡ 模型对比</a>
                </div>
            </div>
        </nav>

        <main>
            <section class="visualization-section">
                <div class="section-header">
                    <h2>📈 数据可视化统计</h2>
                    <button id="refresh-charts-btn" class="btn-primary">刷新数据</button>
                </div>

                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>📊 检测类别统计</h3>
                        <div id="class-dist-chart" class="chart-container"></div>
                    </div>

                    <div class="chart-card">
                        <h3>📉 置信度分布</h3>
                        <div id="confidence-chart" class="chart-container"></div>
                    </div>

                    <div class="chart-card full-width">
                        <h3>🎬 视频时间段分析</h3>
                        <div class="time-chart-controls">
                            <select id="video-task-select">
                                <option value="">选择检测任务</option>
                            </select>
                        </div>
                        <div id="video-time-chart" class="chart-container"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
