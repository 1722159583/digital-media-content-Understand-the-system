<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据统计 - 游戏高光自动剪辑</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body class="main-page">
    <div class="main-bg-video">
        <video autoplay muted loop playsinline>
            <source src="/source/y2mate.com - Star Guardian 2022  Official Orchestral Theme  League of Legends_1080p_1.mp4" type="video/mp4" />
        </video>
        <div class="main-bg-overlay"></div>
    </div>

    <div id="auth-loading">
        <div class="loading-spinner"></div>
        <p>加载中...</p>
    </div>

    <div id="main-app" style="display: none;">
        <header>
            <div class="header-left">
                <div class="header-logo">
                    <img src="/source/c47a07e29f04c6b4c1fdd4722953cc9d.jpg" alt="Logo" class="main-logo" />
                    <div class="header-title">
                        <h1>游戏高光自动剪辑</h1>
                        <span>AI 智能剪辑助手</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div id="user-info" class="user-info">
                    <span class="username">用户</span>
                    <button id="logout-btn" class="btn-logout">退出</button>
                </div>
            </div>
        </header>

        <nav class="main-nav">
            <a href="/" class="nav-item">🎮 剪辑任务</a>
            <a href="/visualization" class="nav-item">📊 数据看板</a>
            <a href="/stats" class="nav-item active">📈 数据统计</a>
            <div class="nav-dropdown">
                <button class="nav-dropdown-toggle">⚙️ 高级工具</button>
                <div class="nav-dropdown-menu">
                    <a href="/kb/manage" class="nav-dropdown-item">📦 素材库管理</a>
                    <a href="/kb/search" class="nav-dropdown-item">🔍 素材搜索</a>
                    <a href="/agent/analysis" class="nav-dropdown-item">🤖 智能分析</a>
                    <a href="/model/compare" class="nav-dropdown-item">⚡ 模型对比</a>
                </div>
            </div>
        </nav>

        <main>
            <section id="stats-section" class="stats-section">
                <div class="section-header">
                    <h2>📊 统计分析概览</h2>
                    <button id="refresh-stats-btn" class="btn-primary">刷新数据</button>
                </div>

                <div class="stats-cards-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📋</div>
                        <div class="stat-info">
                            <div class="stat-value" id="total-tasks">0</div>
                            <div class="stat-label">总任务数</div>
                        </div>
                    </div>

                    <div class="stat-card stat-success">
                        <div class="stat-icon">✅</div>
                        <div class="stat-info">
                            <div class="stat-value" id="completed-tasks">0</div>
                            <div class="stat-label">完成任务数</div>
                        </div>
                        <div class="stat-progress">
                            <div class="progress-bar" id="completed-progress"><span id="completed-rate">0%</span></div>
                        </div>
                    </div>

                    <div class="stat-card stat-warning">
                        <div class="stat-icon">⏳</div>
                        <div class="stat-info">
                            <div class="stat-value" id="pending-tasks">0</div>
                            <div class="stat-label">进行中任务</div>
                        </div>
                        <div class="stat-progress">
                            <div class="progress-bar progress-warning" id="pending-progress"><span id="pending-rate">0%</span></div>
                        </div>
                    </div>

                    <div class="stat-card stat-error">
                        <div class="stat-icon">❌</div>
                        <div class="stat-info">
                            <div class="stat-value" id="failed-tasks">0</div>
                            <div class="stat-label">失败任务数</div>
                        </div>
                        <div class="stat-progress">
                            <div class="progress-bar progress-error" id="failed-progress"><span id="failed-rate">0%</span></div>
                        </div>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stats-panel">
                        <h3>✅ 审核状态统计</h3>
                        <div class="audit-stats-grid">
                            <div class="audit-stat-item audit-pass">
                                <div class="audit-value" id="audit-pass-count">0</div>
                                <div class="audit-label">通过</div>
                                <div class="audit-percentage" id="audit-pass-percent">0%</div>
                            </div>
                            <div class="audit-stat-item audit-review">
                                <div class="audit-value" id="audit-review-count">0</div>
                                <div class="audit-label">待复核</div>
                                <div class="audit-percentage" id="audit-review-percent">0%</div>
                            </div>
                            <div class="audit-stat-item audit-reject">
                                <div class="audit-value" id="audit-reject-count">0</div>
                                <div class="audit-label">不通过</div>
                                <div class="audit-percentage" id="audit-reject-percent">0%</div>
                            </div>
                        </div>
                    </div>

                    <div class="stats-panel">
                        <h3>🎯 检测类别统计</h3>
                        <div id="detect-class-table-container">
                            <table class="stats-table">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>类别名称</th>
                                        <th>检测数量</th>
                                        <th>占比</th>
                                    </tr>
                                </thead>
                                <tbody id="detect-class-body">
                                    <tr><td colspan="4" class="loading-text">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
